name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv --no-config sync --all-groups --locked
      - run: uv --no-config run pre-commit run --all-files
      - run: uv --no-config run pytest --cov --cov-report=term-missing
        env:
          # Per-OS overlay (issue #230): each leg measures its own platform's
          # legs of _jsonl_pipe.py and excludes only the foreign marker.
          COVERAGE_RCFILE: ${{ matrix.os == 'windows-latest' && 'coverage-windows.toml' || 'coverage-posix.toml' }}
      - if: matrix.os == 'windows-latest'
        name: "Supplemental _conpty.py coverage (non-gating, #236)"
        run: |
          uv --no-config run coverage run --rcfile=conpty-coverage.toml -m pytest tests/test_conpty_binding.py tests/test_conpty_epochs.py tests/test_conpty_integration.py -q
          uv --no-config run coverage report --rcfile=conpty-coverage.toml
      - run: uv --no-config run mypy src tests scripts

  package:
    name: Package distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv --no-config build
      - run: uv --no-config run --no-project --with ./dist/*.whl python scripts/check_installed_package.py src/termverify/schemas/termverify.transcript/v1.schema.json
        shell: bash
      - run: uv --no-config run --no-project --with ./dist/*.tar.gz python scripts/check_installed_package.py src/termverify/schemas/termverify.transcript/v1.schema.json
        shell: bash

  docs-contract:
    name: Documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv --no-config sync --all-groups --locked
      - name: Validate OKF knowledge frontmatter
        run: uv --no-config run python scripts/validate_knowledge_frontmatter.py
