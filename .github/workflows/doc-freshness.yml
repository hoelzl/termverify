name: Documentation freshness

# Overdue review_by dates fail here, weekly on main, instead of in the
# commit and pull-request gates (scripts/check_doc_freshness.py explains why).
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overdue:
    name: Overdue documentation reviews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv --no-config sync --all-groups --locked
      - name: Fail on passed review_by dates
        run: uv --no-config run python scripts/check_doc_freshness.py --overdue
