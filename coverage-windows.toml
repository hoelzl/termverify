# Per-OS coverage overlay for the Windows CI quality legs (issue #230).
#
# Selected via COVERAGE_RCFILE in ci.yml. Self-contained on purpose:
# coverage reads exactly one rcfile, so this repeats the gating settings
# from pyproject.toml [tool.coverage] — no pytest invocation ever compares
# the copies, so scripts/validate_coverage_overlays.py (a pre-commit hook)
# is the drift check. The only intended difference from the local-dev
# config is exclude_also: a Windows leg excludes only the `exclude-windows`
# markers (the POSIX legs, which cannot run here), so the Windows-only
# legs of _jsonl_pipe.py are measured and ratcheted here.
# The bare-pragma default is deliberately not widened.

[tool.coverage.run]
branch = true
source = ["termverify"]
omit = ["*/termverify/_conpty.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['# coverage: exclude-windows']
fail_under = 94
precision = 2
