[project]
name = "termverify"
version = "0.2.0.dev0"
description = "Protocol-driven verification for autonomous terminal applications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Matthias Hölzl", email = "tc@xantira.com" },
]
keywords = ["agents", "testing", "terminal", "tui", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "rfc8785>=0.1.4",
]

[project.urls]
Homepage = "https://github.com/hoelzl/termverify"
Repository = "https://github.com/hoelzl/termverify"
Issues = "https://github.com/hoelzl/termverify/issues"

[dependency-groups]
dev = [
    "bump-my-version>=1.2.4",
    "hypothesis>=6.156.2",
    "jsonschema>=4.23",
    "mypy>=1.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.11",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --durations=20"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# scripts/ joins the measurement per the owner decision of 2026-07-24
# (review Slice 8.3): the governance validators are load-bearing gates, so
# their coverage is ratcheted with the package instead of staying invisible.
source = ["termverify", "scripts"]
# The native ConPTY binding executes only on the Windows CI legs; including it
# would make the cross-platform ratchet floor depend on the host OS. Adapter
# logic above it must remain fully ratcheted
# (docs/developer-guide/development.md).
#
# It is no longer "deliberately thin", which this rationale used to claim:
# taking the pseudoconsole over from pywinpty (#197) roughly tripled it. It is
# therefore measured by the supplemental non-gating Windows-leg run
# (conpty-coverage.toml, #236; disposition: Slice 8.3 of the 2026-07-24
# remediation handover) while staying out of this gating floor.
#
# check_installed_package.py runs only as a CI subprocess against the built
# wheel/sdist (ci.yml package job); no in-process test can execute it, so
# measuring it would add permanently-missed statements that dilute the
# ratchet without guarding anything.
omit = ["*/termverify/_conpty.py", "*/scripts/check_installed_package.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Platform legs in _jsonl_pipe.py carry per-OS markers instead of bare
# `# pragma: no cover` (a bare pragma is a static source exclusion that
# would remove the leg on EVERY platform — issue #230). Local runs and any
# run without COVERAGE_RCFILE set exclude both markers here; the CI quality
# legs select one marker via coverage-windows.toml / coverage-posix.toml so
# each leg is measured exactly where it runs.
exclude_also = ['# coverage: exclude-(posix|windows)']
# No-regression ratchet floor: integer floor of the reviewed observed total.
# Re-baselined once on 2026-07-30 when scripts/ joined the measurement
# (owner decision 2026-07-24, review Slice 8.3): observed 93.55% locally,
# 93.29% on the Windows CI leg and 93.45% on the Ubuntu leg (the per-OS
# overlays gate those) — the validators' CLI and error legs are less
# covered than the package, which is the honest number, not a package
# regression. The package-only total at the re-baseline was 95.37% and is
# the reference figure for the next ratchet review; the Windows leg sits
# ~0.3pp above this floor, so treat any margin erosion there as a real
# regression, not noise. Raise only for sustained durable coverage;
# lowering requires explicit owner review
# (docs/developer-guide/development.md). precision = 2 makes the comparison
# a strict floor instead of granting a hidden half-point of integer
# rounding grace.
fail_under = 93
precision = 2

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src", "tests", "scripts"]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# _jsonl_pipe.py is deliberately two-platform: the Windows containment leg
# is wrapped in ``if sys.platform == "win32"`` (unreachable to a POSIX
# mypy, so the ctypes names need no stubs) and its POSIX fallthrough is
# unreachable to a Windows mypy. warn_unreachable would flag the
# fallthrough on Windows and the wrapped leg on POSIX; both are real code
# on their own platform, so the warning is disabled for this module only.
module = "termverify._jsonl_pipe"
warn_unreachable = false

[[tool.mypy.overrides]]
# _posix_pty.py is single-platform code that must still import on Windows,
# so every native leg opens with ``if sys.platform == "win32": raise`` and
# the body below it is unreachable to a Windows mypy while being the only
# real code on POSIX — the same shape, and the same reason, as
# _jsonl_pipe above. ``fcntl``/``termios`` are imported under the same
# guard; their uses live exclusively in those unreachable-on-Windows
# bodies.
module = "termverify._posix_pty"
warn_unreachable = false

[tool.bumpversion]
current_version = "0.2.0.dev0"
commit = true
# No local tag: the Release workflow (.github/workflows/release.yml) creates the
# authoritative vX.Y.Z tag on the server *after* the CI-green gate, so a red
# commit is never tagged. bump-my-version only produces the `Bump version …`
# commit that the workflow keys on. (tag_name documents the format the server
# uses; it is inert while tag = false.)
tag = false
tag_name = "v{new_version}"
# The key is `message`: the previously configured `commit_message` was
# silently ignored and the tool's default ("Bump version: X → Y", with a
# colon) shipped instead (PR #264 review, I1). The Release workflow keys
# on the "Bump version" prefix, which both forms carry; this makes the
# produced message match the documented one.
message = "Bump version {current_version} → {new_version}"
# Manual .dev0 marker scheme (owner decision 2026-07-24, review Slice 8.4):
# main always carries the next planned version with a `.dev0` marker, so the
# release commit is `bump-my-version bump pre` — a real strip commit
# (`X.Y.Z.dev0 → X.Y.Z`), never a degenerate same-version bump — and the
# post-release step (`bump minor`/`patch`/`major`) chooses the next planned
# version and restores the marker in one commit. The Release workflow
# refuses to release any version carrying the marker.
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\.(?P<pre>dev0))?"
serialize = ["{major}.{minor}.{patch}.{pre}", "{major}.{minor}.{patch}"]

[tool.bumpversion.parts.pre]
values = ["dev0", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
# pyproject.toml is the single version source of truth: [project] version is
# read directly by the Release workflow's resolve job, and `__version__` is
# derived from the installed distribution metadata at runtime.
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
# uv.lock records the project's own version in its [[package]] block. If it is
# not updated here, the next `uv sync --locked` fails or silently re-locks.
# Scope the replacement to the project's own block via the unique two-line
# name+version pair.
filename = "uv.lock"
search = """name = "termverify"
version = "{current_version}\""""
replace = """name = "termverify"
version = "{new_version}\""""
